name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Syntax, embedded-source sync & CLI smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Shell syntax
        run: |
          bash -n install_tmedia.sh
          bash -n upgrade_tmedia.sh
          bash -n assets/setup_termux.sh
          bash -n scripts/publish_github.sh

      - name: Python syntax + embedded sources are in sync
        run: |
          python3 - <<'PY'
          import ast, re
          from pathlib import Path
          src = Path('src/tmedia.py').read_text(encoding='utf-8')
          ast.parse(src)
          pattern = re.compile(
              r"cat > \"\$TM_PY\" <<'__TMEDIA_PY_SOURCE_9F3C21__'\n(.*?)\n__TMEDIA_PY_SOURCE_9F3C21__\n",
              re.S,
          )
          for name in ('install_tmedia.sh', 'upgrade_tmedia.sh'):
              match = pattern.search(Path(name).read_text(encoding='utf-8'))
              assert match, f'{name}: embedded heredoc block missing'
              assert match.group(1) + '\n' == src, f'{name}: embedded source is out of sync'
          print('OK: src/tmedia.py parses and both scripts embed it verbatim')
          PY

      - name: Install runtime dependencies
        run: pip install --quiet "Telethon>=1.36,<2" "rich>=13,<15"

      - name: Offline test suites (no Telegram account needed)
        run: |
          python3 tests/test_v12.py
          python3 tests/test_engine.py

      - name: CLI smoke test
        run: |
          python3 src/tmedia.py --version
          python3 src/tmedia.py --help > /dev/null
          python3 src/tmedia.py --doctor

      - name: Secret guard
        run: |
          if git ls-files | grep -Ei '(^|/)([^/]*\.session|config\.json|\.env|tmedia-profile-[^/]*\.tar\.gz)$'; then
            echo "::error::A Telegram session or credential file is tracked by git."
            exit 1
          fi
          echo "OK: no sessions or credentials tracked"
